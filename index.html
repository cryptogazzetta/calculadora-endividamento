<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Capacidade de Endividamento | DeFin Global</title>
<meta name="description" content="Descubra sua faixa ideal de dívida em 3 minutos, com base em métricas reais de mercado.">
<meta property="og:title" content="Qual o nível seguro de endividamento da sua empresa? | DeFin Global">
<meta property="og:description" content="Calculadora gratuita de capacidade de endividamento. 5 métricas, 3 cenários, resultado em 3 minutos.">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'DM Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,#F0F4FF 0%,#F9FAFB 40%,#FFF 100%);
  color:#111827;min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:#BFDBFE}
input,select,button,textarea{font-family:inherit}
a{color:#2563EB;text-decoration:none}
a:hover{text-decoration:underline}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}
@keyframes barFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* Header */
.site-header{background:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E5E7EB}
.site-header img,.site-header svg{height:36px;width:auto}

/* Widget */
.widget{max-width:680px;margin:0 auto;background:#fff;border-radius:16px;padding:36px 32px;
  box-shadow:0 4px 24px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04);border:1px solid #E5E7EB;
  margin-bottom:40px;transition:padding .3s ease}
.widget--results{max-width:760px}
.widget--processing{padding:40px 32px}

/* Step indicator */
.step-indicator{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
.step-dot{width:8px;height:8px;border-radius:50%;background:#D1D5DB;transition:all .3s ease}
.step-dot--active{background:#2563EB;width:24px;border-radius:4px}
.step-dot--done{background:#059669}

@media(max-width:767px){
  .site-header{padding:16px 16px}
  .site-header img,.site-header svg{height:28px}
  .widget{border-radius:12px;padding:24px 18px;margin:0 12px 32px}
  .widget--results{margin:0 8px 32px}
  .hero h1{font-size:26px!important}
  .hero-subtitle{font-size:15px!important}
  .metrics-grid{grid-template-columns:1fr!important}
  .score-labels{font-size:10px!important}
  .score-labels span:nth-child(2),.score-labels span:nth-child(4){display:none}
}

@media(min-width:768px) and (max-width:1024px){
  .widget--results{max-width:720px}
}

/* Accessible focus ring */
:focus-visible{outline:2px solid #3B82F6;outline-offset:2px;border-radius:4px}
</style>

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
"use strict";
const e=React.createElement,{useState,useRef,useEffect,useCallback,useMemo}=React;

// ═══════════════════════════════════════════════════════════════════
// ENGINE (mirrors calculadora-engine/src/*.ts — 100% fidelity)
// ═══════════════════════════════════════════════════════════════════

const Setor={TECNOLOGIA_SAAS:"tecnologia_saas",SERVICOS_PROFISSIONAIS:"servicos_profissionais",INDUSTRIA_MANUFATURA:"industria_manufatura",COMERCIO_VAREJO:"comercio_varejo",AGRONEGOCIO:"agronegocio",SAUDE_EDUCACAO:"saude_educacao",LOGISTICA_TRANSPORTE:"logistica_transporte",CONSTRUCAO_INFRA:"construcao_infra",OUTROS:"outros"};

const SETORES_LIST=[
{id:Setor.TECNOLOGIA_SAAS,nome:"Tecnologia / SaaS",capexPct:.03},
{id:Setor.SERVICOS_PROFISSIONAIS,nome:"Serviços profissionais",capexPct:.02},
{id:Setor.INDUSTRIA_MANUFATURA,nome:"Indústria / Manufatura",capexPct:.06},
{id:Setor.COMERCIO_VAREJO,nome:"Comércio / Varejo",capexPct:.03},
{id:Setor.AGRONEGOCIO,nome:"Agronegócio",capexPct:.045},
{id:Setor.SAUDE_EDUCACAO,nome:"Saúde / Educação",capexPct:.04},
{id:Setor.LOGISTICA_TRANSPORTE,nome:"Logística / Transporte",capexPct:.075},
{id:Setor.CONSTRUCAO_INFRA,nome:"Construção / Infraestrutura",capexPct:.06},
{id:Setor.OUTROS,nome:"Outros",capexPct:.03}];

const SM=Object.fromEntries(SETORES_LIST.map(s=>[s.id,s]));
const P={TAX:.34,PT:.66,TERM:5,AMORT:.2,RATE:.1425};

// Scoring: [threshold, points, band]. Ordered high→low
const SC_DE=[[5,0,"vermelho"],[3.5,5,"laranja"],[3,10,"amarelo"],[2,15,"amarelo"],[1,20,"verde"],[0,25,"verde"]];
const SC_ICR=[[6,20,"verde"],[4.5,16,"verde"],[3.5,12,"amarelo"],[2.5,8,"amarelo"],[1.5,4,"laranja"],[0,0,"vermelho"]];
const SC_DSCR=[[2,25,"verde"],[1.5,20,"verde"],[1.25,15,"amarelo"],[1.1,8,"laranja"],[1,3,"laranja"],[0,0,"vermelho"]];
const SC_NCG=[[30,0,"vermelho"],[22,4,"laranja"],[15,8,"amarelo"],[8,12,"verde"],[0,15,"verde"]];
const SC_CFADS=[[10,15,"verde"],[7,12,"verde"],[4,8,"amarelo"],[2,4,"laranja"],[-Infinity,0,"vermelho"]];

function sft(v,t,inv){
  if(inv){for(let i=0;i<t.length;i++)if(v>=t[i][0])return{pts:t[i][1],band:t[i][2]};return{pts:t[t.length-1][1],band:t[t.length-1][2]};}
  for(let i=0;i<t.length;i++)if(v>=t[i][0])return{pts:t[i][1],band:t[i][2]};
  return{pts:t[t.length-1][1],band:t[t.length-1][2]};
}

const MN={d_ebitda:{n:"Alavancagem: dívida sobre lucro operacional",c:"Dívida/EBITDA"},icr:{n:"Cobertura de juros: lucro vs. despesa financeira",c:"ICR"},dscr:{n:"Cobertura do serviço da dívida: caixa vs. parcelas",c:"DSCR"},ncg_receita:{n:"Capital preso no giro: % da receita no ciclo operacional",c:"NCG/Receita"},cfads_receita:{n:"Caixa disponível para dívida: % da receita livre",c:"CFADS/Receita"}};

const MR={
d_ebitda:{verde:"Abaixo de 2.0x: a dívida é menor que 2 anos de lucro operacional. Confortável para a maioria dos setores e bem vista por bancos.",amarelo:"Entre 2.0x e 3.5x: a dívida equivale a 2–3,5 anos de lucro operacional. Dentro da faixa de mercado, mas exige monitoramento trimestral.",laranja:"Entre 3.5x e 5.0x: a dívida supera 3,5 anos de lucro operacional. Credores costumam exigir garantias adicionais ou spreads maiores.",vermelho:"Acima de 5.0x: a dívida levaria mais de 5 anos de lucro operacional para ser quitada. Risco elevado de não conseguir refinanciar no vencimento."},
icr:{verde:"Acima de 4.5x: o lucro operacional cobre os juros com folga de 4,5 vezes. Perfil equivalente a empresas com classificação de crédito A- ou superior.",amarelo:"Entre 2.5x e 4.5x: o lucro cobre os juros entre 2,5 e 4,5 vezes. Margem suficiente, mas sem grande folga para absorver quedas de receita.",laranja:"Entre 1.5x e 2.5x: o lucro operacional mal supera a despesa de juros. Qualquer queda na receita pode comprometer o pagamento.",vermelho:"Abaixo de 1.5x: zona crítica. O lucro operacional quase não cobre os juros, e qualquer oscilação pode gerar inadimplência."},
dscr:{verde:"Acima de 1.50x: o caixa livre cobre juros + amortização com folga de 50% ou mais. Posição sólida para tomar crédito.",amarelo:"Entre 1.25x e 1.50x: o caixa cobre a dívida, mas está no limite do que bancos costumam exigir como mínimo em contratos (covenant de 1,25x).",laranja:"Entre 1.05x e 1.25x: o caixa cobre a dívida por pouco. Abaixo do covenant padrão de mercado, o que pode gerar restrições contratuais.",vermelho:"Abaixo de 1.05x: o caixa gerado é insuficiente para pagar juros e amortização. A empresa precisaria de caixa acumulado ou novas captações."},
ncg_receita:{verde:"Até 12% da receita presa no ciclo operacional, eficiente. Sobra mais caixa livre para pagar dívida ou investir.",amarelo:"12% a 20%: nível normal, compatível com a média de grandes empresas. Há oportunidade de melhorar negociando prazos com fornecedores e clientes.",laranja:"20% a 30%: parte significativa da receita fica travada entre estoque, contas a receber e contas a pagar. Reduz o caixa disponível para dívida.",vermelho:"Acima de 30%: o ciclo de caixa longo compromete seriamente a geração de caixa. Priorize encurtar prazos de recebimento e estoque."},
cfads_receita:{verde:"Acima de 8% da receita convertida em caixa livre para dívida, geração robusta. Base sólida para tomar crédito com segurança.",amarelo:"5% a 8%: geração de caixa moderada. Endividamento é possível, mas a margem de segurança é limitada se a receita cair.",laranja:"2% a 5%: pouco caixa sobra após impostos e manutenção. Apenas dívidas muito conservadoras são recomendadas.",vermelho:"Abaixo de 2%: quase nada sobra de caixa. Antes de pensar em crédito, priorize aumentar a margem operacional ou reduzir custos fixos."}};

// --- Formatters ---
function fM(v){if(v===0)return"R$ 0";const neg=v<0,a=Math.abs(v);let s;
if(a>=1e9){const b=a/1e9;s=b===Math.floor(b)?`R$ ${Math.floor(b)} ${b===1?"bilhão":"bilhões"}`:`R$ ${b.toFixed(1).replace(".",",")} bilhões`;}
else if(a>=1e6){const m=a/1e6;s=m===Math.floor(m)?`R$ ${Math.floor(m)} ${m===1?"milhão":"milhões"}`:`R$ ${m.toFixed(1).replace(".",",")} ${m===1?"milhão":"milhões"}`;}
else if(a>=1000)s=`R$ ${Math.round(a/1000)} mil`;
else s=`R$ ${Math.round(a)}`;return neg?`−${s}`:s;}
function fX(v,d){d=d||1;return v===Infinity?"∞":`${v.toFixed(d).replace(".",",")}x`;}
function fP(v,d){d=d||1;return`${v.toFixed(d).replace(".",",")}%`;}
function fT(v){return`${(v*100).toFixed(2).replace(".",",")}%`;}

// --- Main calculate ---
function calc(receita,margem,ciclo,setor,divida,taxa,capex){
const sd=SM[setor]||SM[Setor.OUTROS];
const rTaxa=taxa??P.RATE,rCapex=capex??receita*sd.capexPct,rDiv=divida??0,td=rDiv>0;

const ebitda=receita*(margem/100),ncg=(receita/365)*ciclo,ncgP=(ncg/receita)*100;
const cfads=ebitda*P.PT-rCapex,cfadsP=(cfads/receita)*100;
const df=rDiv*rTaxa,srv=df+rDiv*P.AMORT;

const ms=[];
// D/EBITDA
if(!td)ms.push({id:"d_ebitda",v:0,fmt:"0,0x",pts:25,mx:25,b:"verde",ref:"Sua empresa não tem dívida registrada, então a alavancagem é zero. Isso significa que todo o lucro operacional está livre para investir ou captar crédito.",ap:true});
else if(ebitda<=0)ms.push({id:"d_ebitda",v:Infinity,fmt:"∞",pts:0,mx:25,b:"vermelho",ref:"O lucro operacional (EBITDA) é nulo ou negativo, o que torna qualquer nível de dívida insustentável.",ap:true});
else{const v=rDiv/ebitda,r=sft(v,SC_DE,true);ms.push({id:"d_ebitda",v,fmt:fX(v),pts:r.pts,mx:25,b:r.band,ref:MR.d_ebitda[r.band],ap:true});}

// ICR
if(!td)ms.push({id:"icr",v:Infinity,fmt:"∞",pts:20,mx:20,b:"verde",ref:"Sem dívida financeira, não há despesa de juros a cobrir. Este indicador passará a ser relevante quando houver endividamento.",ap:false});
else if(df<=0)ms.push({id:"icr",v:Infinity,fmt:"∞",pts:20,mx:20,b:"verde",ref:"Sua dívida não gera despesa de juros no momento. Cobertura plena.",ap:true});
else{const v=ebitda/df;if(v<0)ms.push({id:"icr",v,fmt:fX(v),pts:0,mx:20,b:"vermelho",ref:"O lucro operacional (EBITDA) é negativo. A empresa opera no prejuízo antes mesmo de pagar juros.",ap:true});
else{const r=sft(v,SC_ICR,false);ms.push({id:"icr",v,fmt:fX(v),pts:r.pts,mx:20,b:r.band,ref:MR.icr[r.band],ap:true});}}

// DSCR
if(!td)ms.push({id:"dscr",v:Infinity,fmt:"∞",pts:25,mx:25,b:"verde",ref:"Sem dívida, não há parcelas a pagar. Quando houver endividamento, esta métrica mostrará se o caixa gerado cobre juros + amortização do principal.",ap:false});
else if(srv<=0)ms.push({id:"dscr",v:Infinity,fmt:"∞",pts:25,mx:25,b:"verde",ref:"Não há parcelas de dívida a pagar. Todo o caixa operacional está livre.",ap:true});
else{const v=cfads/srv;if(v<0)ms.push({id:"dscr",v,fmt:fX(v),pts:0,mx:25,b:"vermelho",ref:"O caixa disponível para dívida (CFADS) é negativo. A operação não gera dinheiro suficiente após impostos e manutenção para pagar qualquer parcela.",ap:true});
else{const r=sft(v,SC_DSCR,false);ms.push({id:"dscr",v,fmt:fX(v),pts:r.pts,mx:25,b:r.band,ref:MR.dscr[r.band],ap:true});}}

// NCG/Receita
{const r=sft(ncgP,SC_NCG,true);ms.push({id:"ncg_receita",v:ncgP,fmt:fP(ncgP),pts:r.pts,mx:15,b:r.band,ref:MR.ncg_receita[r.band],ap:true});}
// CFADS/Receita
{const r=sft(cfadsP,SC_CFADS,false);ms.push({id:"cfads_receita",v:cfadsP,fmt:fP(cfadsP),pts:r.pts,mx:15,b:r.band,ref:MR.cfads_receita[r.band],ap:true});}

let sp=ms.reduce((a,m)=>a+m.pts,0),pen=0,penR=null;
if(!td){if(cfads<0){pen=-25;penR="Atenção: depois de descontar impostos (34%) e o investimento mínimo de manutenção, sua operação não gera caixa livre (CFADS negativo). O score foi reduzido em 25 pontos para refletir essa limitação.";}
else if(cfadsP<2){pen=-15;penR="Atenção: o caixa livre após impostos e manutenção representa menos de 2% da receita. Um nível muito baixo para sustentar dívida. O score foi reduzido em 15 pontos.";}}
const score=Math.max(0,Math.min(100,sp+pen));
const faixa=score>=80?"verde":score>=60?"amarelo":score>=40?"laranja":"vermelho";
const faixaL=score>=80?"Saudável":score>=60?"Moderado":score>=40?"Atenção":"Restrito";

const apls=ms.filter(m=>m.ap);
const fraca=apls.reduce((w,m)=>(m.pts/m.mx)<(w.pts/w.mx)?m:w,apls[0]);

// Scenarios
const cens=[
{id:"conservador",label:"Conservador",eM:.8,cM:1.2,tA:.02,mM:2},
{id:"base",label:"Base",eM:1,cM:1,tA:0,mM:3},
{id:"otimista",label:"Otimista",eM:1.1,cM:.9,tA:-.01,mM:3.5}
].map(c=>{
const cE=ebitda*c.eM,cC=rCapex*c.cM,cF=cE*P.PT-cC,cT=rTaxa+c.tA;
const capM=cE*c.mM,den=cT+P.AMORT,capF=cF>0&&den>0?cF/den:0;
const cap=Math.max(0,Math.min(capM,capF));
return{...c,ebitda:cE,cfads:cF,capM,capF,cap,mEq:ebitda>0?cap/ebitda:0};
});

const cons=cens[0],base=cens[1],otm=cens[2];
let res=null;if(td)res={cons:cons.cap-rDiv,base:base.cap-rDiv,otm:otm.cap-rDiv};

// Headlines
const hl={verde:{sem:"Os indicadores financeiros da sua empresa mostram uma base sólida para buscar crédito com segurança.",com:"Sua estrutura de dívida está saudável. Os indicadores mostram que a empresa consegue honrar os compromissos com folga."},
amarelo:{sem:"Sua empresa pode acessar crédito, mas é importante respeitar os limites indicados para não comprometer o caixa.",com:"A dívida atual está em nível moderado. Ainda há espaço para novas captações, mas com atenção aos indicadores de cobertura."},
laranja:{sem:"Os números da sua empresa pedem cautela: há limitações no caixa ou no ciclo operacional que reduzem a capacidade de endividamento.",com:"O nível de endividamento atual exige atenção. Alguns indicadores estão próximos do limite que credores costumam exigir."},
vermelho:{sem:"A operação atual não gera caixa suficiente para sustentar dívida. É importante fortalecer a rentabilidade antes de buscar crédito.",com:"O endividamento está acima do que a geração de caixa consegue sustentar. Priorize renegociar condições ou reduzir o saldo devedor."}};

const ctas={verde:{t:"Quero meu diagnóstico completo",x:"Com um perfil saudável como o seu, um especialista pode ajudar a identificar as melhores condições de taxa, prazo e instrumento de crédito."},
amarelo:{t:"Receber diagnóstico personalizado",x:"Seu perfil tem potencial, mas alguns ajustes podem ampliar significativamente a capacidade de crédito. Um diagnóstico personalizado mostra exatamente onde atuar."},
laranja:{t:"Analisar opções com especialista",x:"Existem caminhos para fortalecer seus indicadores antes de captar, e escolher o instrumento certo faz toda a diferença. Vamos mapear juntos."},
vermelho:{t:"Diagnóstico gratuito e urgente",x:"Antes de pensar em nova dívida, é essencial entender quais ajustes operacionais podem melhorar rapidamente a sua capacidade de crédito."}};

// Insight
let ins={t:"",tx:"",a:""};
if(fraca.id==="ncg_receita"){const l=(receita/365)*10;ins={t:"Otimize seu ciclo de caixa",tx:`O capital de giro (dinheiro preso entre comprar insumos e receber dos clientes) é o principal gargalo da sua empresa. Hoje, esse capital preso representa ${fraca.fmt} da sua receita. Quanto maior esse percentual, menos caixa sobra para pagar dívida.`,a:`Na prática: cada 10 dias a menos no ciclo de caixa (por exemplo, antecipando recebíveis ou negociando prazo com fornecedores) libera cerca de ${fM(l)} em capital de giro.`};}
else if(fraca.id==="cfads_receita"){const l=receita*.01*P.PT;ins={t:"Aumente a geração de caixa livre",tx:`O caixa disponível para pagar dívida (o que sobra após impostos e investimento de manutenção) representa apenas ${fraca.fmt} da sua receita. Esse é o principal limitador da sua capacidade de endividamento.`,a:`Na prática: cada 1 ponto percentual a mais na margem operacional (EBITDA) gera aproximadamente ${fM(l)} adicionais em caixa livre por ano.`};}
else if(fraca.id==="d_ebitda"){const c2=ebitda*.5*rTaxa;ins={t:"Reduza o peso da dívida sobre o lucro",tx:`A relação dívida/lucro operacional está em ${fraca.fmt}, o que significa que sua dívida equivale a ${fraca.fmt} de lucro operacional anual. ${fraca.v>3.5?"Esse nível está acima do padrão de mercado e pode dificultar novas captações.":"Esse nível está no limite superior do que bancos consideram confortável."}`,a:`Na prática: cada 0,5x de redução nessa relação (via amortização ou aumento de lucro) economiza aproximadamente ${fM(c2)} por ano em despesa financeira.`};}
else if(fraca.id==="icr"){ins={t:"Melhore a cobertura de juros",tx:`A cobertura de juros (quantas vezes o lucro operacional cobre a despesa de juros) está em ${fraca.fmt}. Isso significa que há pouca margem de segurança. Uma queda na receita pode comprometer o pagamento dos juros.`,a:`Na prática: cada 1 ponto percentual de redução na taxa de juros economiza ${fM(rDiv*.01)} por ano e melhora diretamente esse indicador.`};}
else if(fraca.id==="dscr"){const s7=df+rDiv/7,eco=srv-s7;ins={t:"Alivie o peso das parcelas",tx:`A cobertura do serviço da dívida (caixa livre dividido por juros + amortização) está em ${fraca.fmt}. ${fraca.v<1.25?"Isso está abaixo do mínimo que bancos costumam exigir em contrato (1,25x), o que pode gerar restrições.":"A margem é apertada. Qualquer oscilação de caixa pode comprometer o pagamento."}`,a:eco>0?`Na prática: alongar o prazo da dívida de 5 para 7 anos reduziria as parcelas anuais em aproximadamente ${fM(eco)}, aliviando o fluxo de caixa.`:"Na prática: aumente a margem operacional em 2–3 pontos percentuais para gerar mais caixa livre e melhorar essa cobertura."};}

const recs=[];
const mRec={d_ebitda:`O peso da dívida sobre o lucro operacional (${fraca.fmt}) está acima do ideal. Considere fazer amortizações antecipadas ou buscar aumentar o lucro operacional para reduzir essa proporção.`,icr:`A cobertura de juros (${fraca.fmt}) está abaixo do ideal. O lucro operacional mal cobre os juros. Busque renegociar taxas menores ou aumente a rentabilidade da operação.`,dscr:`A cobertura do serviço da dívida (${fraca.fmt}) é o maior limitador. Aumente a margem operacional ou negocie prazos mais longos para reduzir o valor das parcelas anuais.`,ncg_receita:`O capital preso no ciclo operacional (${fraca.fmt} da receita) está alto e reduz o caixa disponível. Renegocie prazos de pagamento com fornecedores e encurte o prazo de recebimento dos clientes.`,cfads_receita:`O caixa livre para dívida (${fraca.fmt} da receita) é baixo. Priorize aumentar a margem operacional ou reduzir gastos com manutenção e investimentos recorrentes.`};

function DebtRangeBar({cons,base,otm}){
const mx=otm*1.15||1;
const[anim,setAnim]=useState(false);
useEffect(()=>{const t=setTimeout(()=>setAnim(true),200);return()=>clearTimeout(t);},[]);
const pct=v=>Math.max(0,(v/mx)*100);

const markers=[{v:cons,l:"Conservador",c:"#059669"},{v:base,l:"Base",c:"#2563EB"},{v:otm,l:"Otimista",c:"#7C3AED"}];
const pcts=markers.map(m=>pct(m.v));
const offsets=[0,0,0];
// Check base vs cons overlap
if(Math.abs(pcts[1]-pcts[0])<14){offsets[0]=-50;offsets[1]=0;}
// Check otm vs base overlap
if(Math.abs(pcts[2]-pcts[1])<14){offsets[2]=offsets[1]===0?-50:0;if(offsets[1]===0)offsets[1]=-25;}
// Check otm vs cons overlap (rare edge case all 3 close)
if(Math.abs(pcts[2]-pcts[0])<14){offsets[0]=-55;offsets[1]=-25;offsets[2]=5;}

return e("div",{style:{position:"relative",padding:"52px 0 8px"}},
  e("div",{style:{height:10,borderRadius:5,background:"#E5E7EB",position:"relative"}},
    e("div",{style:{position:"absolute",left:pos(cons),right:`${100-(otm/mx*100)}%`,height:"100%",borderRadius:5,
      background:"linear-gradient(90deg,#059669,#2563EB,#7C3AED)",
      opacity:anim?1:0,transform:anim?"scaleX(1)":"scaleX(0)",transformOrigin:"left",
      transition:"all 0.8s cubic-bezier(0.25,0.46,0.45,0.94)"}}),
    markers.map((p,i)=>e("div",{key:i,style:{position:"absolute",left:pos(p.v),transform:"translateX(-50%)",
      display:"flex",flexDirection:"column",alignItems:"center",top:offsets[i]-32,
      opacity:anim?1:0,transition:`opacity 0.4s ease ${.4+i*.2}s`}},
      e("span",{style:{fontSize:13,fontWeight:600,color:p.c,whiteSpace:"nowrap"}},fM(p.v)),
      e("div",{style:{width:2,height:offsets[i]===0?16:16+Math.abs(offsets[i]),background:p.c,margin:"4px 0 2px",borderRadius:1}})))),
  e("div",{style:{display:"flex",justifyContent:"space-between",marginTop:24,fontSize:13,color:"#6B7280"}},
    e("span",null,"Conservador"),e("span",null,"Base"),e("span",null,"Otimista")));}

// Step indicator component
function StepIndicator({current}){

const idx=current==="processing"?0:current==="confirm"?2:steps.findIndex(s=>s.k===current);

  steps.map((s,i)=>e("div",{key:s.k,className:`step-dot${i===idx?" step-dot--active":""}${i<idx?" step-dot--done":""}`,
    "aria-label":`${s.l}${i===idx?" (atual)":i<idx?" (concluído)":""}`,title:s.l})));}
